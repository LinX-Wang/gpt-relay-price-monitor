<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinX 登录同步</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7fa;--panel:#fff;--text:#203342;--muted:#647687;--line:#dce5ec;--brand:#128879;--soft:#e8f5f2}
@media(prefers-color-scheme:dark){:root{--bg:#101a23;--panel:#172530;--text:#e6f1f7;--muted:#9eb0bf;--line:#304451;--brand:#48cbb6;--soft:#1b3938}}
*{box-sizing:border-box}body{width:360px;margin:0;padding:20px;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:11px}header img{width:38px;height:38px;border-radius:10px}h1{font-size:17px;margin:0}p{color:var(--muted);margin:10px 0 14px}label{display:grid;gap:5px;margin:12px 0;font-size:12px;color:var(--muted)}input{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:10px;font:inherit}button{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button.primary{background:var(--brand);color:var(--bg);border-color:var(--brand);font-weight:650}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}section{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:14px}section strong{font-size:13px}.site{border-top:1px solid var(--line);padding:10px 0 3px;margin-top:8px}.site span{display:block;color:var(--muted);font-size:12px}.site .ok{color:var(--brand)}#message{white-space:pre-line;overflow-wrap:anywhere;font-size:12px}small{color:var(--muted)}[hidden]{display:none!important}</style></head>
<body><header><img src="icon.png" alt=""><div><h1>LinX 登录同步</h1><small>v1.1.4 · 官网已登录 · 连接自动更新</small></div></header>
<div id="setup"><p>在自己的用量页面点击「自动同步登录」，生成一次性配对码。</p><label>监测网站地址<input id="origin" type="url" value="https://linxprice.bot.cd" placeholder="https://linxprice.bot.cd" autocomplete="off"></label><label>一次性配对码<input id="code" type="password" autocomplete="off" placeholder="粘贴用量页面生成的配对码"></label><button id="pair" class="primary">连接监测服务器</button></div>
<div id="paired" hidden><p id="server"></p><div class="actions"><button id="grant" class="primary">授权站点</button><button id="sync">立即检查</button><button id="pause">暂停同步</button></div><small>每分钟检查一次；打开或切换标签页时也会检查。新增站点后，请回来授权它的官网。</small><section><strong>站点同步状态</strong><div id="results"></div></section><div class="actions"><button id="reset">解除本机配对</button></div></div><p id="message" role="status"></p>
<script src="popup.js"></script></body></html>
